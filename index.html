<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horizon Bank Demo</title><link rel="stylesheet" href="style.css"></head><body>
<section id="login" class="login"><div class="brand"><b>HB</b><span>Horizon Bank<small>FICTIONAL DEMO</small></span></div><div class="box"><h1>Welcome back</h1><p>Customer demo sign in</p><form id="loginForm"><input id="acct" placeholder="Account number" required><input id="pw" type="password" placeholder="Password" required><button>Sign in</button><div id="loginErr" class="err"></div></form><button class="link" id="adminBtn">Admin login</button><button class="link" id="createBtn">Create new account</button></div></section>
<section id="adminLogin" class="login hidden"><div class="brand"><b>HB</b><span>Horizon Bank<small>ADMIN CONSOLE</small></span></div><div class="box"><h1>Administrator</h1><form id="adminForm"><input id="aemail" type="email" placeholder="Email" required><input id="apw" type="password" placeholder="Password" required><button>Admin sign in</button><div id="adminErr" class="err"></div></form><button class="link" id="backBtn">Back</button></div></section>
<section id="create" class="login hidden"><div class="brand"><b>HB</b><span>Horizon Bank<small>DEMO ACCOUNT CREATION</small></span></div><div class="box"><h1>Create demo account</h1><form id="createForm"><input id="nname" placeholder="Full name" required><input id="nage" type="number" min="18" placeholder="Age" required><input id="nbirth" type="date" required><input id="nid" placeholder="ID number" required><input id="nemail" type="email" placeholder="Email" required><input id="npass" type="password" minlength="6" placeholder="New password" required><input id="nconfirm" type="password" minlength="6" placeholder="Confirm password" required><button>Create account</button><div id="createMsg"></div></form><button class="link" id="backCreate">Back to login</button></div></section>

<section id="customer" class="app hidden"><aside><div class="sidebrand"><b>HB</b> Horizon</div><nav><button data-page="dashboard">Dashboard</button><button data-page="transactions">Transactions</button><button data-page="cards">Cards</button><button data-page="payments">Payments</button><button data-page="loans">Loans</button><hr><button data-page="profile">Profile</button><button data-page="notifications">Notifications</button><button data-page="support">Help & Support</button></nav><div class="theme-menu"><span>Theme</span><button type="button" class="theme-option" data-theme-choice="light">Light theme</button><button type="button" class="theme-option" data-theme-choice="dark">Dark theme</button></div><button id="logout" class="logout">Log out</button></aside><main><header><div><small>CUSTOMER PORTAL</small><h2 id="title"></h2></div><span id="chip"></span></header><div id="content"></div></main></section>

<section id="admin" class="app hidden"><aside><div class="sidebrand"><b>HB</b> Admin</div><nav><button data-ap="overview">Overview</button><button data-ap="customers">Customers</button><button data-ap="transactions">Transactions</button><button data-ap="payments">Payments</button><button data-ap="security">Security & Alerts</button><button data-ap="settings">System Settings</button><button data-ap="audit">Audit Log</button></nav><div class="theme-menu"><span>Theme</span><button type="button" class="theme-option" data-theme-choice="light">Light theme</button><button type="button" class="theme-option" data-theme-choice="dark">Dark theme</button></div><button id="adminLogout" class="logout">Log out</button></aside><main><header><div><small>ADMIN CONSOLE</small><h2 id="atitle"></h2></div><span>Administrator</span></header><div id="acontent"></div></main></section><script src="app.js"></script></body></html>
